# ML pipeline: get data -> test data -> train -> quality gate -> test API -> build & push image
name: ML pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

jobs:
  train-test-build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/house-api
      # 'true' once the DOCKERHUB_TOKEN secret is added; until then the image steps are skipped
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install libraries
        run: pip install -r requirements-dev.txt

      - name: Get the data from S3 (dvc pull)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: dvc pull

      - name: Data tests
        run: python -m pytest tests/test_data.py -v

      - name: Drift detector tests
        run: python -m pytest tests/test_drift.py -v

      - name: Train the model
        run: python train.py

      - name: Quality gate (MAE must be below the pass mark)
        run: python -m pytest tests/test_model.py -v

      - name: Use the new model as the champion
        run: cp model.pkl champion.pkl

      - name: API tests
        run: python -m pytest tests/test_api.py -v

      - name: Save the score as a report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: metrics.json

      # Pull requests only test; images are built and pushed only from main
      - name: Docker Hub secrets missing - skipping image build
        if: env.HAS_DOCKERHUB != 'true'
        run: echo "::warning::Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets to build and push the image"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build for Intel/AMD (amd64) AND Apple Silicon (arm64) laptops and servers
      - name: Set up QEMU (emulates arm64 on the amd64 runner)
        if: github.event_name != 'pull_request' && env.HAS_DOCKERHUB == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx (multi-platform builds)
        if: github.event_name != 'pull_request' && env.HAS_DOCKERHUB == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        if: github.event_name != 'pull_request' && env.HAS_DOCKERHUB == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:build-${{ github.run_number }}
